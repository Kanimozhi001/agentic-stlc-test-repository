
name: Validate Generated Test Scripts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Basic Script Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check frontend Python syntax
        id: python_check
        run: |
          python -m compileall -q frontend
          
      - name: Check required folders
        id: folder_check
        run: |
          test -d backend
          test -d frontend
          test -d test-data

      - name: Create validation report
        if: always()
        run: |
          echo "## Script Validation Report" > validation-report.md
          echo "" >> validation-report.md
          echo "- Python syntax check: ${{ steps.python_check.outcome }}" >> validation-report.md
          echo "- Required folders check: ${{ steps.folder_check.outcome }}" >> validation-report.md
          echo "" >> validation-report.md
          echo "**Note:** Static validation only. Actual test cases were not executed." >> validation-report.md

      - name: Add report to Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
